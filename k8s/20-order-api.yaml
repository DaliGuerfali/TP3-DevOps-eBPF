# Service A : order-api (Python FastAPI), point d'entree POST /order.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: perf-lab
  labels: { app: order-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-api }
  template:
    metadata:
      labels: { app: order-api }
    spec:
      containers:
        - name: order-api
          image: order-api:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - { name: PRICING_URL, value: "http://pricing-engine:8080/price" }
            - { name: VALIDATION_ROUNDS, value: "2000" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: perf-lab
spec:
  type: ClusterIP
  selector: { app: order-api }
  ports:
    - port: 8000
      targetPort: 8000
