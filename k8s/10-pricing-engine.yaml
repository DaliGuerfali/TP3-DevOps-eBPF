# Service B : pricing-engine (Go). Les variables d'environnement permettent
# d'injecter latence, latence de traine, erreurs 500 et charge CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-engine
  namespace: perf-lab
  labels: { app: pricing-engine }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pricing-engine }
  template:
    metadata:
      labels: { app: pricing-engine }
    spec:
      containers:
        - name: pricing-engine
          image: pricing-engine:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: LATENCY_MS, value: "15" }
            - { name: JITTER_MS, value: "2" }
            - { name: SLOW_RATIO, value: "0" }
            - { name: SLOW_LATENCY_MS, value: "600" }
            - { name: ERROR_RATE, value: "0" }
            - { name: CPU_ITERATIONS, value: "10000" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-engine
  namespace: perf-lab
spec:
  type: ClusterIP
  selector: { app: pricing-engine }
  ports:
    - port: 8080
      targetPort: 8080
