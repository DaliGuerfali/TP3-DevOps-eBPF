# Configuration minimale de kube-prometheus-stack pour le TP.
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
defaultRules:
  create: false
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    scrapeInterval: 5s
    evaluationInterval: 5s
    retention: 2d
    # Prendre en compte les ServiceMonitor de tous les namespaces / releases
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  adminPassword: perf-lab
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
